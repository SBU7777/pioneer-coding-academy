<!DOCTYPE html>
<html lang="en" data-theme="dark" style="background:#080C16">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Summit Coach Training Academy. Equip. Empower. Encourage. Elevate. An AI-powered coach training academy.">
<title>Summit Coach Training Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --night:#080C16;
  --basecamp:#0F1930;
  --ridge:#16233F;
  --ridge-2:#1E2E50;
  --line:#2C3E63;
  --line-soft:#22314c;
  --blue:#C9A23F;
  --blue-deep:#9E7C24;
  --gold:#E8C25A;
  --gold-soft:#F3D98A;
  --teal:#35D6A6;
  --rose:#FF6B7D;
  --text:#F5F8FF;
  --text-mid:#DCE6F7;
  --text-muted:#B6C6E4;
  --shadow:0 18px 44px -18px rgba(0,0,0,.75);
  --shadow-sm:0 6px 18px -10px rgba(0,0,0,.6);
  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;
  --grad-ascent:linear-gradient(120deg,#B8862B 0%,#E8C25A 50%,#F3D98A 100%);
  --grad-blue:linear-gradient(135deg,#E8C25A 0%,#B8862B 100%);
  --font-scale:1;
  --focus:#F3D98A;
}
:root[data-contrast="high"]{
  --night:#000000;
  --basecamp:#000000;
  --ridge:#0b1020;
  --ridge-2:#111a30;
  --line:#5f7bb0;
  --line-soft:#5f7bb0;
  --text:#FFFFFF;
  --text-mid:#FFFFFF;
  --text-muted:#D6E2FF;
  --blue:#7FB4FF;
  --gold:#FFD27F;
  --teal:#6BF0C7;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(18px * var(--font-scale))}
html{background:#080C16 !important}
body{background:#080C16 !important}
body::before{content:"";position:fixed;inset:0;background:#080C16;z-index:-1;pointer-events:none} /* FORCED-DARK-BACKDROP */
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--night);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4,.display{font-family:'Space Grotesk','Inter',sans-serif;line-height:1.15;letter-spacing:-.01em}
code,.mono{font-family:'Space Mono',monospace}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
img{max-width:100%}

/* reduced motion */
:root[data-motion="reduced"] *{animation:none!important;transition:none!important;scroll-behavior:auto!important}

.skip-link{position:absolute;left:-999px;top:8px;z-index:200;background:var(--blue);color:#fff;padding:10px 16px;border-radius:8px}
.skip-link:focus{left:12px}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;gap:.55em;justify-content:center;
  font-weight:600;font-size:1rem;padding:.72em 1.3em;border-radius:var(--r-sm);
  background:var(--ridge-2);color:var(--text);border:1px solid var(--line);
  transition:transform .12s ease,background .15s ease,border-color .15s ease;
  text-align:center;
}
.btn:hover{transform:translateY(-1px);border-color:var(--blue)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--grad-blue);color:#fff;border:none;box-shadow:0 10px 24px -12px var(--blue-deep)}
.btn-primary:hover{border:none}
.btn-gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#3a2408;border:none}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-lg{font-size:1.1rem;padding:.85em 1.7em}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-sm{padding:.5em .9em;font-size:.9rem}

/* ============ APP SHELL ============ */
#app{min-height:100vh;background:#080C16}
.shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh;background:#080C16}
.sidebar{
  background:var(--basecamp);border-right:1px solid var(--line);
  padding:22px 16px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;margin-bottom:6px}
.brand-mark{width:38px;height:38px;flex:none;border-radius:11px;background:var(--grad-ascent);display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--blue)}
.brand-mark svg{width:22px;height:22px}
.brand-name{font-family:'Space Grotesk';font-weight:700;font-size:1.12rem;letter-spacing:-.02em;line-height:1.05}
.brand-name span{display:block;font-size:.62rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);font-family:'Inter'}
.nav-label{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);padding:14px 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:.66em .8em;border-radius:10px;
  color:var(--text-mid);font-weight:500;font-size:.98rem;width:100%;text-align:left;
  transition:background .14s ease,color .14s ease;
}
.nav-item svg{width:19px;height:19px;flex:none;stroke-width:2}
.nav-item:hover{background:var(--ridge);color:var(--text)}
.nav-item.active{background:var(--ridge-2);color:var(--text);box-shadow:inset 3px 0 0 var(--blue)}
.nav-item .tag{margin-left:auto;font-size:.7rem;background:var(--blue);color:#fff;padding:.05em .5em;border-radius:20px;font-weight:700}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:16px 30px;
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--night) 82%,transparent);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);flex-wrap:wrap;
}
.topbar .page-title{font-size:1.28rem;font-weight:700;font-family:'Space Grotesk'}
.spacer{flex:1}
.stat-pill{display:flex;align-items:center;gap:7px;background:var(--ridge);border:1px solid var(--line);padding:.4em .8em;border-radius:30px;font-size:.9rem;font-weight:600}
.stat-pill svg{width:16px;height:16px}
.stat-pill.xp{color:var(--gold)}
.stat-pill.streak{color:var(--rose)}
.stat-pill.level{color:var(--blue)}
.content{padding:30px;max-width:1160px;width:100%}
.content.wide{max-width:100%}

/* ============ CARDS / GENERIC ============ */
.card{background:var(--ridge);border:1px solid var(--line);border-radius:var(--r-md);padding:22px;box-shadow:var(--shadow-sm)}
.card-pad-lg{padding:28px}
.grid{display:grid;gap:20px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:10px}
.muted{color:var(--text-muted)}
.mid{color:var(--text-mid)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:6px 0 18px;flex-wrap:wrap}
.section-head h2{font-size:1.5rem}
.divider{height:1px;background:var(--line);margin:26px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:.28em .7em;border-radius:20px;background:var(--ridge-2);border:1px solid var(--line);color:var(--text-mid)}
.chip.done{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,var(--line))}
.chip.locked{color:var(--text-muted)}

/* progress */
.bar{height:10px;border-radius:20px;background:var(--ridge-2);overflow:hidden;border:1px solid var(--line-soft)}
.bar>span{display:block;height:100%;background:var(--grad-ascent);border-radius:20px;transition:width .5s cubic-bezier(.3,.9,.3,1)}

/* ============ LANDING / ONBOARDING ============ */
.pre{min-height:100vh;display:flex;flex-direction:column;background:#080C16}
.pre-nav{display:flex;align-items:center;gap:14px;padding:20px 5vw;max-width:1300px;margin:0 auto;width:100%}
.hero{padding:6vh 5vw 8vh;max-width:1300px;margin:0 auto;width:100%;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.hero h1{font-size:clamp(2.4rem,5vw,4.1rem);font-weight:700;letter-spacing:-.03em}
.hero h1 .grad{background:var(--grad-ascent);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{font-size:clamp(1.05rem,1.6vw,1.28rem);color:var(--text-mid);margin:22px 0 30px;max-width:34ch}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border:1px solid color-mix(in srgb,var(--gold) 34%,transparent);padding:.4em .9em;border-radius:30px;margin-bottom:24px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-proof{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap}
.hero-proof .n{font-family:'Space Grotesk';font-size:1.7rem;font-weight:700}
.hero-proof .l{font-size:.82rem;color:var(--text-muted)}

/* signature ascent visual */
.ascent-vis{position:relative;height:420px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,var(--ridge) 0%,var(--basecamp) 100%);overflow:hidden;box-shadow:var(--shadow)}
.ascent-vis .sky{position:absolute;inset:0;background:radial-gradient(120% 90% at 78% 8%,color-mix(in srgb,var(--gold) 30%,transparent),transparent 46%),radial-gradient(90% 70% at 20% 0%,color-mix(in srgb,var(--blue) 26%,transparent),transparent 50%)}
.ascent-vis svg{position:absolute;inset:0;width:100%;height:100%}
.ascent-vis .flag{position:absolute;top:12%;right:16%;text-align:center;color:var(--gold);font-weight:700;font-size:.8rem}
.ascent-node{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--blue);border:3px solid var(--night);box-shadow:0 0 0 3px var(--blue)}
.ascent-node.g{background:var(--gold);box-shadow:0 0 0 3px var(--gold)}

.pre-card{background:var(--ridge);border:1px solid var(--line);border-radius:var(--r-lg);padding:34px;max-width:460px;width:100%;margin:5vh auto;box-shadow:var(--shadow)}
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:7px}
.field input,.field select,.field textarea{
  width:100%;padding:.8em 1em;border-radius:var(--r-sm);background:var(--basecamp);
  border:1px solid var(--line);color:var(--text);font:inherit;font-size:1rem;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);outline:2px solid transparent}
.help{font-size:.82rem;color:var(--text-muted);margin-top:5px}

/* feature row */
.feat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1300px;margin:0 auto;padding:2vh 5vw 8vh}
.feat{padding:24px;border-radius:var(--r-md);background:var(--ridge);border:1px solid var(--line)}
.feat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--ridge-2);margin-bottom:14px;color:var(--blue)}
.feat h3{font-size:1.12rem;margin-bottom:7px}

/* ============ ASSESSMENT ============ */
.assess-opt{display:flex;gap:13px;align-items:flex-start;padding:15px 16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--basecamp);cursor:pointer;transition:border-color .15s,background .15s;width:100%;text-align:left;margin-bottom:11px}
.assess-opt:hover{border-color:var(--blue)}
.assess-opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--basecamp))}
.assess-opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center}
.assess-opt.sel .dot{border-color:var(--blue);background:var(--blue)}
.assess-opt.sel .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.assess-opt b{display:block;font-size:1rem}
.assess-opt small{color:var(--text-muted)}
.stepper{display:flex;gap:8px;margin-bottom:22px}
.stepper i{height:5px;flex:1;border-radius:20px;background:var(--ridge-2)}
.stepper i.on{background:var(--grad-ascent)}

/* ============ ACADEMY CARDS ============ */
.academy-card{position:relative;overflow:hidden;padding:24px;border-radius:var(--r-md);background:var(--ridge);border:1px solid var(--line);transition:transform .15s,border-color .15s;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column}
.academy-card:hover{transform:translateY(-3px);border-color:var(--blue)}
.academy-card .ac-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:16px;color:#fff}
.academy-card h3{font-size:1.28rem;margin-bottom:6px}
.academy-card .count{margin-top:auto;padding-top:14px;font-size:.85rem;color:var(--text-muted);display:flex;gap:14px}
.academy-card.current::after{content:"Your academy";position:absolute;top:14px;right:14px;font-size:.66rem;font-weight:700;background:var(--teal);color:#04231a;padding:.25em .7em;border-radius:20px}

/* ============ COURSE / LESSON ============ */
.course-row{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--ridge);margin-bottom:12px;transition:border-color .15s}
.course-row:hover{border-color:var(--blue)}
.course-ix{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;background:var(--ridge-2);color:var(--blue)}
.course-row .meta{flex:1;min-width:0}
.course-row .meta b{display:block}
.lesson-block{margin-bottom:22px}
.lesson-block .lb-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lesson-block .lb-head .n{width:28px;height:28px;border-radius:8px;background:var(--ridge-2);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.lesson-block h3{font-size:1.12rem}
.reading p{margin-bottom:12px;color:var(--text-mid)}
.reading ul{margin:10px 0 14px 22px;color:var(--text-mid)}
.reading li{margin-bottom:6px}
.code{background:var(--night);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;overflow-x:auto;font-size:.9rem;margin:10px 0;color:#d6e2ff}
.callout{border-left:3px solid var(--blue);background:var(--ridge-2);padding:14px 16px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin:12px 0}
.callout.ai{border-color:var(--gold)}
.callout .cl-tag{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.callout.ai .cl-tag{color:var(--gold)}

/* ============ QUIZ ============ */
.quiz-q{margin-bottom:20px}
.quiz-q .qn{font-weight:600;margin-bottom:12px}
.quiz-opt{display:block;width:100%;text-align:left;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--basecamp);margin-bottom:9px;transition:border-color .15s}
.quiz-opt:hover{border-color:var(--blue)}
.quiz-opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--basecamp))}
.quiz-opt.correct{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 15%,var(--basecamp))}
.quiz-opt.wrong{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,var(--basecamp))}

/* ============ MENTOR ============ */
.mentor-wrap{display:flex;flex-direction:column;height:calc(100vh - 74px)}
.mentor-scroll{flex:1;overflow-y:auto;padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:80%;padding:14px 17px;border-radius:16px;line-height:1.55}
.msg.user{align-self:flex-end;background:var(--grad-blue);color:#fff;border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--ridge);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.ai .who{font-size:.72rem;font-weight:700;color:var(--gold);margin-bottom:5px;letter-spacing:.06em}
.msg p{margin-bottom:8px}.msg p:last-child{margin-bottom:0}
.msg code{background:var(--night);padding:.1em .4em;border-radius:5px;font-size:.9em}
.mentor-input{border-top:1px solid var(--line);padding:16px 30px;display:flex;gap:12px;background:var(--basecamp)}
.mentor-input textarea{flex:1;resize:none;padding:.8em 1em;border-radius:var(--r-sm);background:var(--night);border:1px solid var(--line);color:var(--text);font:inherit;font-size:1rem;max-height:120px}
.mentor-suggest{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--text-muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ============ CERTIFICATE ============ */
.cert{background:linear-gradient(135deg,var(--ridge) 0%,var(--basecamp) 100%);border:2px solid var(--line);border-radius:var(--r-lg);padding:44px;position:relative;overflow:hidden;text-align:center}
.cert::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% -10%,color-mix(in srgb,var(--gold) 18%,transparent),transparent 60%);pointer-events:none}
.cert .seal{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;background:var(--grad-ascent);display:grid;place-items:center;box-shadow:0 10px 24px -10px var(--gold)}
.cert h2{font-size:2rem;margin:4px 0}
.cert .learner{font-family:'Space Grotesk';font-size:2.4rem;font-weight:700;background:var(--grad-ascent);-webkit-background-clip:text;background-clip:text;color:transparent;margin:16px 0 8px}
.cert-meta{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.cert-meta div{text-align:center}
.cert-meta .k{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.cert-meta .v{font-weight:600;margin-top:3px}

/* ============ COMMUNITY ============ */
.thread{display:flex;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--ridge);margin-bottom:12px}
.avatar{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:700;font-family:'Space Grotesk';color:#fff}
.thread .t-meta{font-size:.82rem;color:var(--text-muted);margin-top:3px}
.thread .t-stats{margin-left:auto;text-align:right;font-size:.82rem;color:var(--text-muted);flex:none}

/* ============ BADGES ============ */
.badge{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--ridge);text-align:center}
.badge .bimg{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem}
.badge.locked{opacity:.4}
.badge b{font-size:.86rem}
.badge small{font-size:.72rem;color:var(--text-muted)}

/* ============ A11Y PANEL / MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(3,7,16,.6);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px}
.modal{background:var(--basecamp);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;max-width:520px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto}
.modal h2{margin-bottom:4px}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.opt-row:last-child{border:none}
.opt-row b{display:block}
.seg{display:inline-flex;background:var(--ridge);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:.4em .8em;border-radius:8px;font-size:.86rem;font-weight:600;color:var(--text-mid)}
.seg button.on{background:var(--blue);color:#fff}
.toggle{width:52px;height:30px;border-radius:20px;background:var(--ridge-2);border:1px solid var(--line);position:relative;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text-muted);transition:transform .15s,background .15s}
.toggle.on{background:var(--blue)}
.toggle.on::after{transform:translateX(22px);background:#fff}

/* mission banner */
.mission{background:var(--grad-blue);border-radius:var(--r-md);padding:26px 28px;color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 34px -18px var(--blue-deep)}
.mission::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 55%,transparent),transparent 65%)}
.mission .eyebrow{color:rgba(255,255,255,.85)}
.mission h2{font-size:1.55rem;position:relative}
.mission p{color:rgba(255,255,255,.9);position:relative;max-width:52ch}

.list-plain{list-style:none}
.check-item{display:flex;gap:11px;align-items:flex-start;padding:9px 0}
.check-item .ck{width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;margin-top:2px}
.check-item.done .ck{background:var(--teal);border-color:var(--teal)}
.check-item.done b{text-decoration:line-through;color:var(--text-muted)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--ridge);border:1px solid var(--blue);border-radius:14px;padding:14px 20px;box-shadow:var(--shadow);z-index:300;display:flex;align-items:center;gap:12px;font-weight:600;transition:transform .35s cubic-bezier(.3,1.2,.4,1);max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .ti{width:34px;height:34px;border-radius:50%;background:var(--grad-ascent);display:grid;place-items:center;flex:none}

.hamburger{display:none}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty .ei{font-size:2.4rem;margin-bottom:10px}

/* ============ RESPONSIVE ============ */
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;width:270px;transform:translateX(-100%);transition:transform .25s ease}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--ridge)}
  .hero-grid{grid-template-columns:1fr;gap:34px}
  .ascent-vis{height:320px}
  .feat-row{grid-template-columns:1fr}
  .g-2,.g-3{grid-template-columns:1fr}
  .content{padding:20px}
  .topbar{padding:14px 18px}
  .mentor-scroll,.mentor-input{padding-left:18px;padding-right:18px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
}
@media(max-width:560px){
  .cert{padding:26px}
  .cert .learner{font-size:1.7rem}
  .hero-proof{gap:18px}
  .msg{max-width:92%}
}
/* code editor + practice + code lab */
.editor{width:100%;min-height:110px;font-family:'Space Mono',monospace;font-size:.85rem;line-height:1.55;background:var(--night);color:#d6e2ff;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;resize:vertical;white-space:pre;tab-size:2;overflow:auto}
.editor:focus{border-color:var(--blue);outline:2px solid transparent}
.runbar{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.out{background:var(--night);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;font-family:'Space Mono',monospace;font-size:.84rem;white-space:pre-wrap;min-height:44px;color:#bfe3d0;overflow-x:auto}
.frame{width:100%;height:240px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--ridge)}
.pr-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;margin-bottom:14px;background:var(--basecamp)}
.pr-kind{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--blue);margin-bottom:8px}
.pr-result{font-weight:600;font-size:.9rem;margin-top:10px;min-height:1.1em}
.pr-result.ok{color:var(--teal)} .pr-result.no{color:var(--rose)}
.fill-in{font-family:'Space Mono',monospace;padding:.35em .6em;border-radius:6px;border:1px solid var(--blue);background:var(--ridge);color:#d6e2ff;font-size:.9rem;min-width:150px;margin:0 2px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:.6em 1em;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;display:inline-flex;gap:7px;align-items:center}
.tabs button svg{width:16px;height:16px}
.tabs button.on{color:var(--text);border-bottom-color:var(--blue)}
</style>

    blocks:[

/* ---------- level math ---------- */
function levelFor(xp){ return Math.max(1, Math.floor(xp/200)+1); }
function levelFloor(l){ return (l-1)*200; }
function xpIntoLevel(){ const l=state.user.level; return state.user.xp - levelFloor(l); }

/* ---------- gamification ---------- */
function awardXP(n){
  if(!state.user) return;
  state.user.xp += n;
  const newLevel = levelFor(state.user.xp);
  if(newLevel>state.user.level){ state.user.level=newLevel; toast(I.trophy,`Level up! You reached level ${newLevel}`); }
}
function earnBadge(id){
  if(state.earnedBadges.has(id)) return;
  const b = BADGES.find(x=>x.id===id); if(!b) return;
  state.earnedBadges.add(id);
  toast(`<span style="font-size:1.1rem">${b.emoji}</span>`, `Badge unlocked: ${b.name}`);
}

/* ---------- toast ---------- */
let toastTimer;
function toast(iconHtml, text){
  const t=$('#toast');
  t.innerHTML=`<span class="ti">${iconHtml}</span><span>${esc(text)}</span>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}

/* ---------- accessibility application ---------- */
function applyA11y(){
  const r=document.documentElement, a=state.a11y;
  r.setAttribute('data-theme','dark');
  r.setAttribute('data-contrast', a.contrast);
  r.setAttribute('data-motion', a.motion==='reduced'?'reduced':'full');
  r.style.setProperty('--font-scale', a.fontScale);
}
// respect OS reduced-motion on first load
if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ state.a11y.motion='reduced'; }

/* plain-language helper: swap heavier copy when plain mode is on */
function plain(normal, simple){ return state.a11y.plain ? simple : normal; }

  state.view=view; state.route=params; state.sidebarOpen=false;

}

/* ---------- Python runtime (Pyodide), loaded on first use ---------- */
let __pyPromise=null;
function ensurePyodide(){
  if(window.__pyReady) return Promise.resolve(window.__py);
  if(__pyPromise) return __pyPromise;
  __pyPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
    s.onload=async()=>{ try{ const py=await loadPyodide(); window.__py=py; window.__pyReady=true; resolve(py);}catch(e){reject(e);} };
    s.onerror=()=>reject(new Error('network'));
    document.head.appendChild(s);
  });
  return __pyPromise;
}

/* ---------- practice runners ---------- */
function fmtVal(x){ try{ return typeof x==='object'? JSON.stringify(x): String(x); }catch(e){ return String(x); } }
function runWeb(id){
  const code=document.getElementById(id+'_code').value;
  const frame=document.getElementById(id+'_frame');
  if(frame) frame.srcdoc=code;
}
function runJS(id){
  const code=document.getElementById(id+'_code').value;
  const out=document.getElementById(id+'_out');
  const logs=[];
  const fake={ log:(...a)=>logs.push(a.map(fmtVal).join(' ')), error:(...a)=>logs.push(a.map(fmtVal).join(' ')), warn:(...a)=>logs.push(a.map(fmtVal).join(' ')) };
  try{ new Function('console', code)(fake); }
  catch(e){ logs.push('Error: '+e.message); }
  const text=logs.join('\n');
  out.textContent=text||'(no output)';
  const it=window.__practice[id];
  if(it&&it.expect) markResult(id, text.includes(it.expect));
}
async function runPython(id){
  const code=document.getElementById(id+'_code').value;
  const out=document.getElementById(id+'_out');
  out.textContent='Loading Python engine (first run only, a few seconds)...';
  let py;
  try{ py=await ensurePyodide(); }
  catch(e){ out.textContent='Could not load the Python engine. Check your connection, then Run again.'; return; }
  out.textContent='Running...';
  let result='';
  try{
    py.runPython('import sys, io\n_b=io.StringIO()\nsys.stdout=_b\nsys.stderr=_b');
    await py.runPythonAsync(code);
    result=py.runPython('_b.getvalue()');
  }catch(e){
    try{ result=py.runPython('_b.getvalue()'); }catch(_){}
    result=(result||'')+'\n'+String(e.message||e);
  }finally{
    try{ py.runPython('sys.stdout=sys.__stdout__\nsys.stderr=sys.__stderr__'); }catch(_){}
  }
  out.textContent=(result||'').trim()||'(no output)';
  const it=window.__practice[id];
  if(it&&it.expect) markResult(id, (result||'').includes(it.expect));
}
function practiceRun(id){
  const it=window.__practice[id];
  let lang='js';
  if(it.kind==='web') lang='web';
  else if(it.kind==='python') lang='python';
  else if(it.kind==='write'||it.kind==='debug') lang=it.lang||'js';
  if(lang==='web') runWeb(id); else if(lang==='python') runPython(id); else runJS(id);
}
function revealSolution(id){
  const it=window.__practice[id];
  const ta=document.getElementById(id+'_code');
  if(ta&&it.solution){ ta.value=it.solution; practiceRun(id); }
}
function checkPredict(id, choice){
  const it=window.__practice[id];
  const wrap=document.getElementById(id+'_opts');
  [...wrap.children].forEach((b,i)=>{ b.classList.remove('correct','wrong'); if(i===it.answer) b.classList.add('correct'); else if(i===choice) b.classList.add('wrong'); });
  markResult(id, choice===it.answer);
}
function checkFill(id){
  const it=window.__practice[id];
  const raw=(document.getElementById(id+'_in').value||'').trim().toLowerCase().replace(/[.;]+$/,'');
  markResult(id, raw===String(it.answer).trim().toLowerCase());
}
function checkReflect(id){
  const it=window.__practice[id];
  const raw=(document.getElementById(id+'_in').value||'').trim();
  const words=raw?raw.split(/\s+/).length:0;
  const need=it.minWords||12;
  const r=document.getElementById(id+'_res');
  if(words<need){
    if(r){ r.className='pr-result no'; r.textContent='Take it a little further. Aim for at least '+need+' words so you have something real to work from. ('+words+' so far)'; }
    return;
  }
  if(r){ r.className='pr-result ok'; r.textContent='Saved. Strong reflection. This is exactly the kind of thinking that builds a coach.'; }
  if(!state.solvedPractice) state.solvedPractice=new Set();
  if(!state.solvedPractice.has(id)){ state.solvedPractice.add(id); awardXP(10); const p=document.querySelector('.stat-pill.xp span'); if(p&&state.user) p.textContent=state.user.xp+' XP'; toast(I.zap,'Reflection saved. +10 XP'); }
}
function markResult(id, ok){
  const r=document.getElementById(id+'_res'); if(!r) return;
  r.className='pr-result '+(ok?'ok':'no');
  r.textContent= ok ? '✓ Correct. Well done.' : 'Not quite. Compare it to the goal and try again.';
  if(ok){
    if(!state.solvedPractice) state.solvedPractice=new Set();
    if(!state.solvedPractice.has(id)){ state.solvedPractice.add(id); awardXP(10); const p=document.querySelector('.stat-pill.xp span'); if(p&&state.user) p.textContent=state.user.xp+' XP'; toast(I.zap,'Practice solved. +10 XP'); }
  }
}

/* ---------- practice item markup ---------- */
function practiceItemHTML(it, id){
  const promptHtml=`<p class="mid" style="margin-bottom:10px">${it.prompt}</p>`;
  if(it.kind==='reflect'){
    return `<div class="pr-item"><div class="pr-kind">Reflection</div>${promptHtml}
      <textarea class="editor" id="${id}_in" spellcheck="true" aria-label="your reflection" placeholder="Write your honest answer here..."></textarea>
      <div class="runbar"><button class="btn btn-primary btn-sm" onclick="checkReflect('${id}')">Save reflection</button></div>
      <div class="pr-result" id="${id}_res"></div></div>`;
  }
  if(it.kind==='predict'){
    return `<div class="pr-item"><div class="pr-kind">Predict the output</div>${promptHtml}
      <div class="code" style="margin:0 0 10px">${esc(it.code||'')}</div>
      <div id="${id}_opts">${it.options.map((o,i)=>`<button class="quiz-opt" onclick="checkPredict('${id}',${i})">${esc(o)}</button>`).join('')}</div>
      <div class="pr-result" id="${id}_res"></div></div>`;
  }
  if(it.kind==='fill'){
    return `<div class="pr-item"><div class="pr-kind">Fill in the blank</div>${promptHtml}
      <div class="mono" style="background:var(--night);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;overflow-x:auto">${esc(it.before||'')}<input class="fill-in" id="${id}_in" placeholder="${esc(it.blank||'answer')}" aria-label="answer">${esc(it.after||'')}</div>
      <div class="runbar"><button class="btn btn-primary btn-sm" onclick="checkFill('${id}')">Check answer</button></div>
      <div class="pr-result" id="${id}_res"></div></div>`;
  }
  const isWeb = it.kind==='web' || (it.kind==='debug'&&it.lang==='web');
  const langLabel = it.kind==='web'?'Live web preview' : (it.kind==='debug'?'Fix the code':'Runs real '+((it.lang==='python')?'Python':(it.lang==='js'?'JavaScript':'code')));
  const code = it.starter!=null? it.starter : (it.broken||'');
  const runner = isWeb
    ? `<iframe class="frame" id="${id}_frame" title="Live preview" sandbox="allow-scripts allow-same-origin"></iframe>`
    : `<div class="out" id="${id}_out">Press Run to execute.</div><div class="pr-result" id="${id}_res"></div>`;
  return `<div class="pr-item"><div class="pr-kind">${langLabel}</div>${promptHtml}
    <textarea class="editor" id="${id}_code" spellcheck="false" aria-label="code editor">${esc(code)}</textarea>
    <div class="runbar"><button class="btn btn-primary btn-sm" onclick="practiceRun('${id}')">Run ▶</button>
      ${it.kind==='debug'?`<button class="btn btn-ghost btn-sm" onclick="revealSolution('${id}')">Show the fix</button>`:''}</div>
    ${runner}</div>`;
}

function viewLesson(){
  const {acId,course}=state.route;
  const a=ACADEMIES.find(x=>x.id===acId);
  const L=getLesson(acId,course);
  const key=acId+':'+course;
  const safe=key.replace(/[^a-z0-9]/gi,'_');
  const done=state.completedLessons.has(key);
  const hasQuiz=!!QUIZZES[key];
  window.__practice={};
  let pcount=0;

  const blocksHtml=L.blocks.map(b=>{
    const m=BLOCK_META[b.type]||{n:'•'};
    if(b.type==='ai'){
      return `<section class="lesson-block card"><div class="lb-head"><span class="n">${m.n}</span><h3>${esc(b.h)}</h3></div>
        <div class="callout ai"><div class="cl-tag">In plain words</div>${b.body}</div></section>`;
    }
    if(b.type==='practice' && b.items){
      const items=b.items.map(it=>{ const id=safe+'_p'+(pcount++); window.__practice[id]=it; return practiceItemHTML(it,id); }).join('');
      return `<section class="lesson-block card"><div class="lb-head"><span class="n">${m.n}</span><h3>${esc(b.h)}</h3></div>

function completeLesson(key){
  const first=state.completedLessons.size===0;
  if(!state.completedLessons.has(key)){
    state.completedLessons.add(key);
    const [acId,course]=key.split(':');
    const L=getLesson(acId,course);
    awardXP(L.xp);
    toast(I.zap,`Lesson complete. +${L.xp} XP`);
    if(first) earnBadge('first-step');
    maybeUnlockProject(acId);
  }
  const [acId]=key.split(':');
  go('academy',{id:acId});
}
function maybeUnlockProject(acId){
  const a=ACADEMIES.find(x=>x.id===acId);
  const done=a.courses.filter(c=>state.completedLessons.has(acId+':'+c)).length;
  const idx=Math.floor(done/2); // unlock a project every 2 courses
  for(let i=0;i<Math.min(idx,a.projects.length);i++){
    const pk=acId+':p'+i;
    if(!state.unlockedProjects.has(pk)){ state.unlockedProjects.add(pk); earnBadge('builder'); }
  }
}

   ============================================================ */
function startQuiz(key){
  const q=QUIZZES[key];
  state.quizState={ key, answers:new Array(q.questions.length).fill(null), submitted:false };
  go('quiz',{key});
}
function viewQuiz(){
  const key=state.route.key, quiz=QUIZZES[key], qs=state.quizState;
  const [acId,course]=key.split(':');
  return `
    <button class="btn btn-ghost btn-sm" onclick="openLesson('${acId}','${esc(course)}')">← Back to lesson</button>
    <h1 style="font-size:1.7rem;margin:16px 0 4px">${esc(quiz.title)}</h1>
    <p class="muted" style="margin-bottom:22px">Answer all ${quiz.questions.length} questions. You need every one right to earn the badge, but you can retake it freely.</p>
    ${quiz.questions.map((q,qi)=>`
      <div class="quiz-q card">
        <div class="qn">${qi+1}. ${esc(q.q)}</div>
        ${q.opts.map((o,oi)=>{
          let cls='quiz-opt';
          if(qs.submitted){ if(oi===q.a) cls+=' correct'; else if(qs.answers[qi]===oi) cls+=' wrong'; }
          else if(qs.answers[qi]===oi) cls+=' sel';
          return `<button class="${cls}" ${qs.submitted?'disabled':''} onclick="answerQuiz(${qi},${oi})">${esc(o)}</button>`;
        }).join('')}
      </div>`).join('')}
    ${qs.submitted?quizResult(key):`
      <button class="btn btn-primary btn-lg" ${qs.answers.includes(null)?'disabled':''} onclick="submitQuiz('${key}')">Submit answers ${I.arrow}</button>
      ${qs.answers.includes(null)?'<p class="help">Answer every question to submit.</p>':''}`}
  `;
}
function answerQuiz(qi,oi){ if(state.quizState.submitted) return; state.quizState.answers[qi]=oi; render(); }
function submitQuiz(key){
  state.quizState.submitted=true;
  const quiz=QUIZZES[key], qs=state.quizState;
  const score=quiz.questions.filter((q,i)=>qs.answers[i]===q.a).length;
  qs.score=score;
  if(score===quiz.questions.length){
    if(!state.completedLessons.has(key)){
      state.completedLessons.add(key);
      const [acId,course]=key.split(':');
      awardXP(getLesson(acId,course).xp);
      maybeUnlockProject(acId);
    }
    state.passedQuizzes.add(key);
    if(state.completedLessons.size>=1) earnBadge('first-step');
    earnBadge('quiz-ace');
  }
  render();
}
function quizResult(key){
  const quiz=QUIZZES[key], qs=state.quizState, [acId]=[key.split(':')[0]];
  const perfect=qs.score===quiz.questions.length;
  return `<div class="card" style="border-color:${perfect?'var(--teal)':'var(--gold)'};text-align:center;padding:26px">
    <div style="font-size:2.2rem">${perfect?'🎯':'📚'}</div>
    <h2 style="font-size:1.4rem;margin:6px 0">${qs.score} / ${quiz.questions.length} correct</h2>
    <p class="mid">${perfect?'Perfect. Lesson complete and XP awarded.':'Close. Review the highlighted answers and retake to lock in the lesson.'}</p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap">
      ${perfect?`<button class="btn btn-primary" onclick="go('academy',{id:'${key.split(':')[0]}'})">Continue ${I.arrow}</button>`
               :`<button class="btn btn-primary" onclick="startQuiz('${key}')">Retake quiz</button>`}
    </div>
  </div>`;
}

function viewCertificates(){

  ACADEMIES.forEach(a=>{

function claimCert(academyName){

          <button class="${a.fontScale==1.15?'on':''}" onclick="setA11y('fontScale',1.15)">A+</button>
          <button class="${a.fontScale==1.3?'on':''}" onclick="setA11y('fontScale',1.3)">A++</button>
          <button class="${a.fontScale==1.5?'on':''}" onclick="setA11y('fontScale',1.5)">A+++</button>
        </div>
      </div>

      <div class="opt-row"><div><b>High contrast</b><div class="muted" style="font-size:.82rem">Stronger contrast for low vision</div></div>
        <button class="toggle ${a.contrast=='high'?'on':''}" role="switch" aria-checked="${a.contrast=='high'}" aria-label="High contrast" onclick="setA11y('contrast', state.a11y.contrast=='high'?'normal':'high')"></button>
      </div>

      <div class="opt-row"><div><b>Reduce motion</b><div class="muted" style="font-size:.82rem">Turn off animations</div></div>
        <button class="toggle ${a.motion=='reduced'?'on':''}" role="switch" aria-checked="${a.motion=='reduced'}" aria-label="Reduce motion" onclick="setA11y('motion', state.a11y.motion=='reduced'?'full':'reduced')"></button>
      </div>

      <div class="opt-row"><div><b>Plain language</b><div class="muted" style="font-size:.82rem">Simpler, shorter wording</div></div>
        <button class="toggle ${a.plain?'on':''}" role="switch" aria-checked="${a.plain}" aria-label="Plain language" onclick="setA11y('plain', !state.a11y.plain)"></button>
      </div>

      <button class="btn btn-primary btn-block" style="margin-top:20px" onclick="closeModal()">Done</button>
    </div>
  </div>`;
  const first=root.querySelector('.seg button'); if(first) first.focus();
  document.addEventListener('keydown',escClose);
}
function escClose(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){ $('#modal-root').innerHTML=''; document.removeEventListener('keydown',escClose); }
function setA11y(key,val){
  state.a11y[key]=val; applyA11y();
  // re-render underlying app for plain-language copy swaps, then refresh modal
  render(); openA11y();
}

/* ============================================================
   ROUTER + INIT
   ============================================================ */
const PRE=['landing','signup','assessment'];
const TITLES={ dashboard:'Dashboard', academies:'Schools', academy:'School', lesson:'Lesson', quiz:'Quiz',
  projects:'Projects', community:'Community', certificates:'Certificates', achievements:'Achievements', profile:'Profile' };

function render(){
  applyA11y();
  const app=$('#app');
  if(PRE.includes(state.view)){
    if(state.view==='landing') app.innerHTML=viewLanding();
    else if(state.view==='signup') app.innerHTML=viewSignup();
    else app.innerHTML=viewAssessment();
    return;
  }
  if(!state.user){ state.view='landing'; app.innerHTML=viewLanding(); return; }
  let content='', wide=false;
  switch(state.view){
    case 'dashboard': content=viewDashboard(); break;
    case 'academies': content=viewAcademies(); break;
    case 'academy': content=viewAcademy(); break;
    case 'lesson': content=viewLesson(); break;
    case 'quiz': content=viewQuiz(); break;
    case 'projects': content=viewProjects(); break;
    case 'community': content=viewCommunity(); break;
    case 'certificates': content=viewCertificates(); break;
    case 'achievements': content=viewAchievements(); break;
    case 'profile': content=viewProfile(); break;
    default: content=viewDashboard();
  }
  const title = state.view==='academy' && ACADEMIES.find(a=>a.id===state.route.id) ? ACADEMIES.find(a=>a.id===state.route.id).name.replace(' Academy','') : (TITLES[state.view]||'Summit');
  app.innerHTML=shell(title, content, wide);
}

// boot
applyA11y();
render();
</script>
</body>
</html>
